<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --bg:#151515; --tab:#232323; --tab-on:#e2483d; --fg:#eee; --mut:#9a9a9a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:44px; background:var(--bg); color:var(--fg);
    font:13px system-ui, "Segoe UI", sans-serif; user-select:none; overflow:hidden; }
  /* gap e padding dos botões 1 px menores desde o 🔍 Pokédex: a 1919 px, com as abas medindo ~2,4 GB, ainda sobram ~45 px (antes, 50) */
  .bar { display:flex; align-items:center; gap:5px; height:44px; padding:0 8px; }
  .tab { display:flex; align-items:center; gap:7px; height:32px; padding:0 10px; border-radius:8px;
    background:var(--tab); cursor:pointer; border:1px solid transparent; }
  .tab:hover { border-color:#3a3a3a; }
  .tab.on { background:var(--tab-on); }
  /* 07/11/2026 (pedido do usuário): número + nome da conta + só a CPU (%); a memória saiu da aba */
  .tab .k { font-size:14px; font-weight:700; color:var(--fg); }
  .tab input { width:110px; }
  .tab.on .k, .tab.on .n, .tab.on .m { color:#ffe4e1; }
  .tab .n { font-weight:600; white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width: 1200px) { .tab .n { display:none; } }
  .tab .m { font-size:11px; color:var(--mut); margin-left:auto; font-variant-numeric:tabular-nums; }
  .voto { padding:1px 5px; border-radius:5px; background:#f5c518; cursor:pointer; font-size:12px;
    animation:pisca 1.6s ease-in-out infinite; }
  .voto:hover { background:#ffd84d; }
  @keyframes pisca { 50% { opacity:.55; } }
  .dot { width:7px; height:7px; border-radius:50%; background:#3fb950; }
  .dot.load { background:#d29922; }
  .sp { flex:1; }
  button { height:30px; padding:0 9px; border-radius:7px; border:1px solid #333; background:#1f1f1f;
    color:var(--fg); cursor:pointer; font:inherit; white-space:nowrap; flex-shrink:0; }
  .m { white-space:nowrap; }
  @media (max-width: 1500px) { .tab { min-width:0; padding:0 9px; } .tab .m { display:none; } }
  /* Janela estreita: os botões ficam só com o ícone (o nome segue na dica do mouse) */
  .lbl { display:none; }
  button { padding:0 8px; }
  button:hover { background:#2a2a2a; }
  button.on { border-color:#3fb950; color:#7ee787; }
  button.inc { opacity:.5; cursor:default; } /* já incluído no Ultra leve */
  /* 🏦 com aviso do caixa ainda não visto (ou um alarme que continua valendo) */
  /* Lives pausadas (⏸ no painel): o 📺 fica com a borda amarela e o ⏸ ao lado */
  button#tw.pausa { border-color:#f5c518; }
  button#tw.pausa::after { content:'⏸'; margin-left:3px; color:#f5c518; }
  button.cx-amarelo { border-color:#e3b341; }
  button.cx-laranja { border-color:#f0883e; background:#33251a; }
  button.cx-vermelho { border-color:#f0544f; background:#3a1f1f; animation:pisca 1.6s ease-in-out infinite; }
  /* Barra apertada (abas com medições longas): os botões de modo ficam só com o ícone, em vez de o último sair da tela */
  .compacto .lbl.opc { display:none; }
  input { width:110px; font:inherit; background:#000; color:#fff; border:1px solid #555; border-radius:4px; padding:2px 4px; }
  .menu { position:fixed; }
  button.lic-aviso { border-color:#e3b341; color:#e3b341; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div id="tabs" style="display:flex;gap:6px"></div>
  <div class="sp"></div>
  <button id="pd" title="Pokédex de consulta para o Mini Games: as sombras de todas as espécies do jogo, filtradas pelas pistas que você marcar. Usa só os dados do jogo que o app já guardou; não conversa com o jogo.">🔍</button>
  <button id="rep" title="Reposição automática de bolas: compra na loja do jogo (em coins) quando o estoque de uma conta fica abaixo do número escolhido, até o total que você definir. Nas 4 contas, cada uma com a sua regra.">🛒</button>
  <button id="hu" title="Melhor hunt: as hunts que mais rendem para o pokémon em campo de cada conta (XP, ouro e risco), simulando a luta com as regras do jogo.">🗺</button>
  <button id="cx" title="Caixa do projeto: a carteira do jogo na rede Solana, de onde saem os saques. Lê as transações novas a cada 10 min (dados públicos) e avisa quando sai dinheiro que não é saque, quando o caixa cai rápido ou quando os saques param.">🏦</button>
  <button id="ec" title="Economia do RMT: cotação gema ⇄ coin, melhores rotas de conversão, ciclos e flips (com os dados que o app já coleta)">💰<span class="lbl"> Economia</span></button>
  <button id="pk" title="Monitor de Pokémons do RMT: vendas reais, preço por nota e pechinchas (pela Conta 1)">🐉<span class="lbl"> Pokémons</span></button>
  <button id="pr" title="Precificador: quanto pedir, em gemas, por um pokémon das suas contas ou por uma ficha do jogo (Vender rápido, Preço justo e Esperar)">💲</button>
  <button id="pc" title="Monitor de Preços do RMT: registro a cada 6 h e gráfico do que sobe e desce (pela Conta 1)">📈<span class="lbl"> Preços</span></button>
  <button id="sn" title="Sniper do Mercado (RMT): cada conta compra sozinha os alvos da lista dela, até o preço máximo">🎯<span class="lbl"> Sniper</span></button>
  <button id="tw" title="Painel de lives (Twitch e Kick) da conta selecionada (Ctrl+T)">📺<span class="lbl"> Lives</span></button>
  <button id="imp" title="Importar login: entrar com Google pelo Chrome e trazer o login para a conta selecionada">🔑</button>
  <button id="grid" title="Mostrar as 4 contas ao mesmo tempo (Ctrl+G)">⊞<span class="lbl"> Ver as 4</span></button>
  <span id="zoomBox" style="display:none;align-items:center;gap:4px">
    <button id="zOut" title="Diminuir o jogo nos quadros (Ctrl -)">−</button>
    <span id="zVal" style="min-width:38px;text-align:center;color:var(--mut)"></span>
    <button id="zIn" title="Aumentar o jogo nos quadros (Ctrl +)">+</button>
    <button id="fps" title="Quadros por segundo das contas que NÃO estão selecionadas. Menos = menos processador. A caçada não muda, só a animação."></button>
  </span>
  <button id="mute" title="Silenciar contas que não estão visíveis">🔇<span class="lbl opc"> Mudo nas ocultas</span></button>
  <button id="thr" title="Economia extra: o que ninguém vê para de desenhar — as contas ocultas, os chats escondidos e tudo com o app minimizado. O jogo continua caçando (a conexão não cai); só a tela para. O vídeo das lives continua rodando: é ele que dá os pontos.">🐢<span class="lbl opc"> Economia extra</span></button>
  <button id="ultra" title="Ultra leve: o mínimo de processador e memória. Tudo da Economia extra, mais:&#10;• o 'movimento reduzido' do próprio jogo (sem chuva, brilhos e animações contínuas);&#10;• a página escondida que inchar de memória é recarregada.&#10;O vídeo das lives da Twitch e da Kick fica como está: é ele que dá os pontos.">🍃<span class="lbl opc"> Ultra leve</span></button>
  <button id="rel" title="Recarregar conta atual (F5)">⟳</button>
  <button id="relAll" title="Recarregar as 4 contas">⟳<span class="lbl"> Todas</span></button>
  <button id="nova" class="lic-aviso" style="display:none">⬆ Nova versão</button>
  <button id="lic" style="display:none"></button>
</div>
<script>
  let st = { active:0, names:[], loading:[] }, met = { mem:[], cpu:[] };
  const tabs = document.getElementById('tabs');

  function render() {
    tabs.innerHTML = '';
    st.names.forEach((name, i) => {
      const t = document.createElement('div');
      t.className = 'tab' + (i === st.active ? ' on' : '');
      t.title = name + ' · Ctrl+' + (i+1) + ' · Tab: próxima conta (Shift+Tab: a anterior) · botão direito: renomear, recarregar, importar login ou sair da conta';
      const mem = '';
      const cpu = met.cpu[i] != null ? met.cpu[i] + '%' : '';
      t.innerHTML = `<span class="dot ${st.loading[i] ? 'load' : ''}"></span>
        <span class="k">${i+1}</span><span class="n"></span><span class="m">${mem}${cpu}</span>`;
      t.querySelector('.n').textContent = name;
      // Voto do TopIdle liberado nesta conta: o selo abre a página de voto no navegador
      if (st.votos?.[i]) {
        const v = document.createElement('span');
        v.className = 'voto';
        v.textContent = '🗳';
        v.title = 'Voto disponível no TopIdle — clique para votar (abre aqui no app, com o nick desta conta)';
        v.onclick = e => { e.stopPropagation(); api.votar(i); };
        t.querySelector('.n').after(v);
      }
      t.onclick = () => api.select(i);
      t.oncontextmenu = e => { e.preventDefault(); api.tabMenu(i); };
      tabs.appendChild(t);
    });
    document.getElementById('mute').classList.toggle('on', !!st.muteHidden);
    const thr = document.getElementById('thr');
    thr.classList.toggle('on', !!(st.throttleHidden || st.ultra));
    thr.classList.toggle('inc', !!st.ultra);
    const ultra = document.getElementById('ultra');
    ultra.classList.toggle('on', !!st.ultra);
    ultra.dataset.dica ??= ultra.title;
    ultra.title = ultra.dataset.dica + `\n\nA conta à vista desenha ${st.fpsVista ? `a ${st.fpsVista} quadros por segundo` : 'sem limite de quadros'} (com ou sem o Ultra leve). Botão direito aqui: ${st.fpsVista ? 'sem limite' : '30 quadros por segundo'}.`;
    document.getElementById('grid').classList.toggle('on', !!st.grid);
    const tw = document.getElementById('tw');
    tw.classList.toggle('on', !!st.twitchOpen);
    tw.classList.toggle('pausa', !!st.twitchPausado);
    tw.dataset.dica ??= tw.title;
    tw.title = st.twitchPausado ? '⏸ Lives pausadas: nenhuma aberta. Abra o painel e clique em ▶ para retomar.\n\n' + tw.dataset.dica : tw.dataset.dica;
    const cx = document.getElementById('cx');
    cx.className = st.caixa ? 'cx-' + st.caixa : '';
    cx.dataset.dica ??= cx.title;
    cx.title = st.caixa ? '⚠ Tem aviso do caixa do projeto. Clique para ver.\n\n' + cx.dataset.dica : cx.dataset.dica;
    document.getElementById('zoomBox').style.display = st.grid ? 'flex' : 'none';
    document.getElementById('zVal').textContent = Math.round((st.gridZoom || 1) * 100) + '%';
    document.getElementById('fps').textContent = '🎞 ' + (st.gridFps ? st.gridFps + ' fps' : 'sem limite');
    ajustar();
  }

  // Mede com os nomes à vista: se a barra passar da largura, esconde os nomes dos botões de modo
  function ajustar() {
    const bar = document.getElementById('bar');
    document.body.classList.remove('compacto');
    if (bar.scrollWidth > bar.clientWidth) document.body.classList.add('compacto');
  }

  // Renomear (pelo menu do botão direito): o campo entra no lugar do número; Enter grava, Esc desiste
  let renomeando = false;
  api.onRenomear(i => {
    const t = tabs.children[i];
    if (!t || t.querySelector('input')) return;
    renomeando = true;
    const name = st.names[i];
    const inp = document.createElement('input');
    inp.value = name;
    inp.maxLength = 24;
    t.querySelector('.n').replaceWith(inp);
    inp.focus(); inp.select();
    inp.onclick = e => e.stopPropagation();
    inp.onblur = () => { renomeando = false; if (inp.value.trim() && inp.value.trim() !== name) api.rename(i, inp.value); else render(); };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = name; inp.blur(); } };
  });
  api.onState(s => { st = s; if (!renomeando) render(); });
  // Enquanto se renomeia uma aba, a medição de 5 em 5 s não redesenha as abas (sumia com o campo do nome)
  api.onMetrics(m => { met = m; if (!tabs.querySelector('input')) render(); });
  // Tab: próxima conta (Shift+Tab, a anterior), menos enquanto se digita o nome de uma aba
  addEventListener('keydown', e => {
    if (e.key !== 'Tab' || e.ctrlKey || e.altKey || e.metaKey || e.target.matches('input')) return;
    e.preventDefault();
    if (!e.repeat) api.proxima(e.shiftKey ? -1 : 1);
  });
  document.getElementById('mute').onclick = () => api.toggle('muteHidden');
  document.getElementById('thr').onclick = () => { if (!st.ultra) api.toggle('throttleHidden'); };
  document.getElementById('ultra').onclick = () => api.toggle('ultra');
  document.getElementById('ultra').oncontextmenu = e => { e.preventDefault(); api.fpsVista(); };
  document.getElementById('tw').onclick = () => api.twToggle();
  document.getElementById('sn').onclick = () => api.snAbrir();
  document.getElementById('pc').onclick = () => api.pcAbrir();
  document.getElementById('pk').onclick = () => api.pkAbrir();
  document.getElementById('pr').onclick = () => api.prAbrir();
  document.getElementById('ec').onclick = () => api.ecAbrir();
  document.getElementById('pd').onclick = () => api.pdAbrir();
  document.getElementById('rep').onclick = () => api.repAbrir();
  document.getElementById('hu').onclick = () => api.huAbrir();
  document.getElementById('cx').onclick = () => api.cxAbrir();
  document.getElementById('imp').onclick = () => api.importLogin(st.active);
  document.getElementById('grid').onclick = () => api.toggle('grid');
  document.getElementById('zOut').onclick = () => api.gridZoom(-0.05);
  document.getElementById('zIn').onclick = () => api.gridZoom(0.05);
  document.getElementById('fps').onclick = () => api.cycleFps();
  document.getElementById('zVal').ondblclick = () => api.gridZoom(0);
  document.getElementById('rel').onclick = () => api.reload(st.active);
  document.getElementById('relAll').onclick = () => api.reloadAll();
  // Quantos dias faltam do teste ou da licença; o clique abre a tela de pagamento e da key
  api.onLic(l => {
    const b = document.getElementById('lic');
    b.style.display = '';
    b.textContent = `⏳ ${l.dias} ${l.dias === 1 ? 'dia' : 'dias'}`;
    b.title = (l.modo === 'teste' ? `Teste grátis até ${l.ateTxt}` : `Licença válida até ${l.ateTxt}`) + '. Clique para ver como pagar e colar a key.';
    b.classList.toggle('lic-aviso', l.dias <= 5);
    const n = document.getElementById('nova');
    n.style.display = l.nova ? '' : 'none';
    n.title = `Saiu a versão ${l.nova}. Clique para baixar o instalador. Seus logins e ajustes continuam guardados.`;
    ajustar();
  });
  document.getElementById('lic').onclick = () => api.licAbrir();
  document.getElementById('nova').onclick = () => api.licLink('versao');
</script>
</body>
</html>
